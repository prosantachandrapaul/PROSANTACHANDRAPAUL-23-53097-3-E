<!DOCtype html>
<html>
   <head>
     <title>Seventh form</title>
	 <link rel="stylesheet" href="style-1.css">
   </head>
   <body>
   <h1>REGISTRETION FORM</h1>
     <form>
	   <div>
	     <label for="fullname">FULLNAME:</label>
		 <input type="text" name="fullname" id="fullname">
		 </div> <br>
		 
		 <div>
	     <label for="email">EMAIL:</label>
		 <input type="text" name="email" id="email">
		 </div> <br>
	 
         <div>
	     <label for="password">PASSWORD:</label>
		 <input type="password" name="password" id="password">
		 </div> <br>	 
		 
		 <div>
	     <label for="dob">DATH OF BIRTH:</label>
		 <input type="Date" name="dob" id="dob">
		 </div> <br>
	 
	     <div>
	     <label for="image">CHOOSE OUR PHOTO:</label>
		 <input type="file" name="photo" id="photo">
		 </div> <br>
	     
		 
		 <div>
	     <label for="gender">GENDER:</label>
		 <input type="radio" name="gender" id="gender" value="male">male
		  <input type="radio" name="gender" id="gender" value="female">female
		 </div> <br>
		 
		 
		 <div>
	     <label for="religion">RELIGION:</label>
		 <input type="checkbox" name="r1" id="r1" value="islam">ISLAM
		  <input type="checkbox" name="r2" id="r2" value="hindu" checked>HINDU
		 </div> <br>
		 
		 <div>
	     <label for="department">DEPARTMENT:</label>
		 <select name="department"><option value="cse"selected>CSE</option><option value="eee">EEE</option></select>
		 </div> <br>
		 
		 <div>
	     <label for="address">WRITE DOWN YOUR ADDRESS:</label>
		 <textarea rows="10"></textarea>
		 </div> <br>
		 
		 <div>
		 <input type="submit" value="register">
		 <input type="reset" value="clear">
		 </div>
		 
		 
		 
	 
	 
	 </form>
   
   
   
   
   
   
   
   
   
   </body>













</html>
